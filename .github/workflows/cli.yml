name: CLI CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cli.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/cli/**"
      - "packages/cw-reader/**"
      - "packages/transpiler/**"
  pull_request:
    paths:
      - ".github/workflows/cli.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/cli/**"
      - "packages/cw-reader/**"
      - "packages/transpiler/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18
          - 20
          - 22
    env:
      PNPM_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --dangerously-allow-all-builds

      - name: Test workflow reader
        run: pnpm --filter @stable-canvas/cw-reader test

      - name: Test transpiler
        run: pnpm --filter @stable-canvas/comfyui-client-transpiler test

      - name: Test CLI
        run: pnpm --filter @stable-canvas/comfyui-client-cli test
